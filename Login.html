<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <h1>Bienvenido/a A SGRSI</h1>
    <p>Por favor, ingresa tus credenciales para iniciar sesión.</p>

    </form>
</body>
</html>
