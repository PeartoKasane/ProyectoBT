<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/global.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100 justify-content-between">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="#">Panel de Administración</a>
            <div class="navbar-nav ms-auto">
                <a class="btn btn-outline-danger btn-sm fw-bold" href="Login.html">Cerrar Sesión</a>
            </div>
        </div>
    </nav>

    <main class="container my-4 flex-grow-1">
        
        <header class="row mb-4">
            <div class="col-12 text-center">
                <h1 class="display-6 fw-bold text-dark bg-secondary text-white py-3 rounded shadow-sm">Panel de Administración</h1>
                <div class="alert alert-info mt-3 shadow-sm" role="alert">
                    La prioridad de los tickets va de <strong>0 a 2</strong>, donde 0 es la más alta y 2 es la más baja.
                </div>
            </div>
        </header>

        <section class="row mb-4" aria-label="Listado de Tickets">
            <div class="col-12">
                <div class="table-responsive shadow-sm rounded bg-white p-3">
                    <table class="table table-striped table-hover align-middle m-0">
                        <thead class="table-dark text-center">
                            <tr>
                                <th scope="col" class="col-prioridad">Prioridad</th>
                                <th scope="col">Pendiente</th>
                                <th scope="col">Realizado</th>
                            </tr>
                        </thead>
                        <tbody id="registro_tickets" class="text-center">
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <section class="row justify-content-center mb-4" aria-label="Acciones de administración">
            <div class="col-auto text-center">
                <button type="button" class="btn btn-dark fw-semibold shadow-sm px-4 py-2" onclick="location.href='Admin.html'">
                    Modificar estado de los tickets
                </button>
            </div>
        </section>

        <section class="row justify-content-center mb-4" aria-label="Visualización de datos">
            <div class="col-12 col-md-8 text-center">
                <figure class="card shadow-sm p-4 bg-white border-0 d-flex align-items-center justify-content-center m-0">
                    <div style="max-width: 600px; width: 100%;">
                        <img src="assets/Imgs/Gráfico.png" alt="Gráfico de Incidencias" class="img-fluid rounded w-100 h-auto">
                    </div>
                    <figcaption class="visually-hidden">Gráfica de Incidencias del sistema</figcaption>
                </figure>
            </div>
        </section>
        
    </main>

    <footer class="w-100 bg-secondary text-white text-center py-3">
       <p class="m-0 small">&copy; 2026 I.T.I</p>
    </footer>

   <!-- Modelo que representa los equipos -->
<script src="assets/js/modelos/equipo.js"></script>

<!-- Modelo que representa los tickets -->
<script src="assets/js/modelos/ticket.js"></script>

<!-- Gestión del almacenamiento de tickets -->
<script src="assets/js/storage/ticketStorage.js"></script>

<!-- Lógica relacionada con los tickets -->
<script src="assets/js/servicios/ticketServicio.js"></script>

<!-- Vista de la página de administración -->
<script src="assets/js/vistas/adminVista.js"></script>

<!-- Controlador de la página de administración -->
<script src="assets/js/controladores/adminControlador.js"></script>

<!-- JavaScript de Bootstrap -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous">
</script>
<!-- Comentario: script de Bootstrap incluido una sola vez -->
</body>
</html>
