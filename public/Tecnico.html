<!--
  este archivo es la vista del técnico.
  no lo toco mucho porque si rompo algo se rompe todo.
  pero basicamente hace falta para mostrar la pantalla.
-->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Técnico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/global.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100 justify-content-between">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <!-- Contenedor de la navbar: mantiene el padding y ancho del header -->
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="#">Panel de Técnico</a>
            <!-- Zona de la derecha en la navbar: espacio para el menú del usuario y botón de logout -->
            <div class="navbar-nav ms-auto d-flex align-items-center gap-2">
                <!-- Aquí se inyecta el selector de ventana/usuario por JS -->
                <div id="selectorVentanaUsuario" class="d-flex gap-2"></div>
                <a class="btn btn-outline-danger btn-sm fw-bold" href="index.html" onclick="localStorage.removeItem('sesionUsuario');">Cerrar Sesión</a>
            </div>
        </div>
    </nav>

    <main class="container my-4 flex-grow-1">
        <header class="row mb-4">
            <!-- Título de la página y aviso explicativo -->
            <div class="col-12 text-center">
                <h1 class="display-6 fw-bold text-dark bg-secondary text-white py-3 rounded shadow-sm">Vista Técnica</h1>
                <div class="alert alert-info mt-3 shadow-sm" role="alert">
                    Consulta tickets y solicitudes de preparación de laboratorio en modo lectura.
                </div>
            </div>
        </header>

        <section class="row mb-4" aria-label="Tickets del técnico">
            <div class="col-12">
                <!-- Contenedor de tabla para tickets: fondo blanco y scroll en móvil -->
                <div class="tablaContenedor table-responsive shadow-sm rounded bg-white p-3">
                    <h2 class="h4 fw-bold text-dark mb-3">Tickets</h2>
                    <table class="table table-striped table-hover align-middle m-0">
                        <thead class="table-dark text-center">
                            <tr>
                                <th scope="col">Salón</th>
                                <th scope="col">Ticket</th>
                                <th scope="col" class="col-prioridad">Prioridad</th>
                                <th scope="col">Estado</th>
                            </tr>
                        </thead>
                        <tbody id="registro_tickets" class="text-center"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section class="row mb-4" aria-label="Solicitudes del técnico">
            <div class="col-12">
                <!-- Contenedor de tabla para solicitudes de preparación -->
                <div class="tablaContenedor table-responsive shadow-sm rounded bg-white p-3">
                    <h2 class="h4 fw-bold text-dark mb-3">Solicitudes de preparación</h2>
                    <table class="table table-striped table-hover align-middle m-0">
                        <thead class="table-dark text-center">
                            <tr>
                                <th scope="col">Docente</th>
                                <th scope="col">Laboratorio</th>
                                <th scope="col">Programa</th>
                                <th scope="col">Descripción</th>
                                <th scope="col">Fecha</th>
                                <th scope="col">Hora</th>
                                <th scope="col">Estado</th>
                            </tr>
                        </thead>
                        <tbody id="registro_solicitudes" class="text-center"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <footer class="w-100 bg-secondary text-white text-center py-3">
        <p class="m-0 small">&copy; 2026 I.T.I</p>
    </footer>

    <script src="assets/js/modelos/equipo.js"></script>
    <script src="assets/js/modelos/ticket.js"></script>
    <script src="assets/js/modelos/solicitudPrograma.js"></script>
    <script src="assets/js/modelos/usuario.js"></script>
    <script src="assets/js/storage/ticketStorage.js"></script>
    <script src="assets/js/storage/solicitudProgramaStorage.js"></script>
    <script src="assets/js/servicios/ticketServicio.js"></script>
    <script src="assets/js/servicios/solicitudProgramaServicio.js"></script>
    <script src="assets/js/servicios/permisosServicio.js"></script>
    <script src="assets/js/vistas/adminVista.js"></script>
    <script src="assets/js/vistas/solicitudProgramaVista.js"></script>
    <script src="assets/js/vistas/usuarioVista.js"></script>
    <script src="assets/js/controladores/usuarioControlador.js"></script>
    <script src="assets/js/controladores/tecnicoControlador.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
