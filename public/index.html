<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/global.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100 justify-content-between">

    <header class="w-100 bg-secondary text-white text-center py-4 shadow-sm">
        <h1 class="display-5 fw-bold m-0">Bienvenido/a a SGRSI</h1>
    </header>

    <main class="container d-flex flex-column align-items-center justify-content-center my-auto p-3">
        <section class="card shadow border-0 p-4 w-100 login-card" aria-labelledby="login-title">
            <!-- Abraza todo el formulario; el ancho máximo se controla desde assets/css/global.css-->
            <div class="card-body">
                <h2 id="login-title" class="card-title text-center mb-3 h3 fw-bold text-dark">Iniciar Sesión</h2>
                <p class="text-muted text-center small mb-4">Por favor, ingresa tus credenciales para acceder al sistema.</p>

                <form id="form-login">
                    <!-- Caja para el input de C.I.: separa el label y el input y añade margen abajo -->
                    <div class="mb-3">
                        <label for="ci" class="form-label fw-semibold text-secondary">C.I:</label>
                        <input type="text" id="ci" name="ci" class="form-control form-control-lg text-center" placeholder="Ej: 1234567-8" required>
                    </div>

                    <!-- Caja para el input de contraseña: igual que la anterior-->
                    <div class="mb-4">
                        <label for="contrasena" class="form-label fw-semibold text-secondary">Contraseña:</label>
                        <input type="password" id="contrasena" name="contrasena" class="form-control form-control-lg text-center" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn btn-dark btn-lg w-100 fw-bold shadow-sm py-2">
                        Ingresar
                    </button>
                </form>
            </div>
        </section>
    </main>

    <footer class="w-100 bg-secondary text-white text-center py-3">
        <p class="m-0 small">&copy; 2026 I.T.I</p>
    </footer>

    <script src="assets/js/servicios/permisosServicio.js"></script>
    <script src="assets/js/modelos/usuario.js"></script>
    <script src="assets/js/storage/usuarioStorage.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        // espera a que termine de cargar el HTML
        document.addEventListener('DOMContentLoaded', () => {
            const formulario = document.getElementById('form-login');

            // esto crea los usuarios de prueba
            UsuarioStorage.inicializarUsuariosPrueba();

            if (!formulario) {
                return;
            }

            // el submit del form
            formulario.addEventListener('submit', function (event) {
                event.preventDefault();

                // agarra lo que puso el usuario
                const cedula = document.getElementById('ci').value.trim();
                const contrasena = document.getElementById('contrasena').value.trim();

                if (!cedula || !contrasena) {
                    alert('Debes completar cédula y contraseña.');
                    return;
                }

                // revisa si existe ese usuario con esa contraseña
                const usuarioEncontrado = UsuarioStorage.buscarUsuarioPorCredenciales(cedula, contrasena);

                if (!usuarioEncontrado) {
                    alert('Credenciales inválidas.');
                    return;
                }

                // guarda solo la data que necesita para la sesion
                const usuario = {
                    cedula: usuarioEncontrado.cedula,
                    nombre: usuarioEncontrado.nombre,
                    roles: PermisoServicio.normalizarRoles(usuarioEncontrado.roles)
                };

                localStorage.setItem('sesionUsuario', JSON.stringify(usuario));

                // averiguamos a que pagina va segun el rol principal
                const rolPrincipal = PermisoServicio.obtenerRolPrincipal(usuario.roles);
                const destino = PermisoServicio.obtenerRutaVentana(rolPrincipal);
                window.location.href = destino || 'index.html';
            });
        });
    </script>
</body>
</html>
