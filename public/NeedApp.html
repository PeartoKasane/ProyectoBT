<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Necesito un Programa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/global.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100 justify-content-between">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <!-- Contenedor de navbar: ancho completo con padding horizontal -->
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="#">Solicitud de Software</a>
            <!-- Zona derecha de la navbar con botones de navegación -->
            <div class="navbar-nav ms-auto">
                <a class="btn btn-outline-light btn-sm fw-bold" href="Docente.html">Volver</a>
            </div>
        </div>
    </nav>

    <main class="container my-4 flex-grow-1 d-flex flex-column justify-content-center needapp-main">
        
        <!-- Título de la página centrado. El ancho del contenedor principal lo controla la clase .needapp-main en assets/css/global.css -->
        <header class="row mb-4">
            <div class="col-12 text-center">
                <h1 class="display-6 fw-bold text-dark bg-secondary text-white py-3 rounded shadow-sm m-0">Necesito un Programa</h1>
            </div>
        </header>

        <form id="form-solicitud-programa" class="bg-white p-4 rounded shadow-sm border-0">
            <!-- Mensaje oculto que muestra éxito/error al enviar la solicitud -->
            <div class="alert alert-secondary d-none" id="mensajeSolicitudPrograma" role="alert"></div>

            <!-- Sección con los campos de la solicitud: organizados en grid responsive -->
            <section class="row g-3 mb-4" aria-label="Datos de la solicitud">
                <div class="col-12 col-md-6">
                    <label for="docentePrograma" class="form-label fw-semibold text-secondary">Nombre del docente:</label>
                    <input type="text" id="docentePrograma" class="form-control" placeholder="Ej: Ana Gómez" required>
                </div>
                <div class="col-12 col-md-6">
                    <label for="laboratorioPrograma" class="form-label fw-semibold text-secondary">Laboratorio o sala:</label>
                    <select id="laboratorioPrograma" class="form-select" required>
                        <option value="">-- Seleccione --</option>
                        <option value="Laboratorio 1">Laboratorio 1</option>
                        <option value="Laboratorio 2">Laboratorio 2</option>
                        <option value="Laboratorio 3">Laboratorio 3</option>
                        <option value="Sala de informática">Sala de informática</option>
                    </select>
                </div>

                <div class="col-12">
                    <label for="programaNecesitado" class="form-label fw-semibold text-secondary">Programa que necesita:</label>
                    <input type="text" id="programaNecesitado" class="form-control" placeholder="Ej: Python, Visual Studio Code, Adobe Photoshop" required>
                </div>

                <div class="col-12">
                    <label for="detallePrograma" class="form-label fw-semibold text-secondary">Descripción o detalle:</label>
                    <textarea id="detallePrograma" class="form-control" rows="4" placeholder="Describa qué necesita instalar, configurar o preparar para el laboratorio." required></textarea>
                </div>

                <div class="col-12 col-md-6">
                    <label for="fechaPrograma" class="form-label fw-semibold text-secondary">Fecha:</label>
                    <input type="date" id="fechaPrograma" class="form-control" required>
                </div>

                <div class="col-12 col-md-6">
                    <label for="horaPrograma" class="form-label fw-semibold text-secondary">Hora:</label>
                    <input type="time" id="horaPrograma" class="form-control" required>
                </div>
            </section>

            <!-- Botón enviar centrado en su columna -->
            <section class="row justify-content-center" aria-label="Acciones del formulario">
                <div class="col-auto">
                    <button type="submit" class="btn btn-dark fw-semibold shadow-sm px-5 py-2">
                        Enviar solicitud
                    </button>
                </div>
            </section>

        </form>
    </main>

    <footer class="w-100 bg-secondary text-white text-center py-3">
        <p class="m-0 small">&copy; 2026 I.T.I</p>
    </footer>

    <script src="assets/js/modelos/solicitudPrograma.js"></script>
    <script src="assets/js/storage/solicitudProgramaStorage.js"></script>
    <script src="assets/js/servicios/solicitudProgramaServicio.js"></script>
    <script src="assets/js/servicios/permisosServicio.js"></script>
    <script src="assets/js/vistas/solicitudProgramaVista.js"></script>
    <script src="assets/js/controladores/solicitudProgramaControlador.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
