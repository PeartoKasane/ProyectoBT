<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - SGRSI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../assets/css/global.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100 justify-content-between">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="#">SGRSI - Inventario</a>
            <div class="navbar-nav ms-auto d-flex flex-row gap-2">
                <a class="btn btn-outline-light btn-sm fw-bold" href="./administrador.html" data-roles="administrador">Inicio</a>
                <a class="btn btn-outline-light btn-sm fw-bold" href="./direccion.html" data-roles="direccion">Inicio</a>
                <a class="btn btn-outline-light btn-sm fw-bold" href="./docente.html" data-roles="docente">Inicio</a>
                <a class="btn btn-outline-light btn-sm fw-bold" href="./tecnico.html" data-roles="tecnico">Inicio</a>
                <a class="btn btn-light btn-sm fw-bold" href="./inventario.html">Inventario</a>
                <a class="btn btn-outline-light btn-sm fw-bold" href="./tickets.html">Tickets</a>
                <a class="btn btn-outline-light btn-sm fw-bold" href="./solicitudes.html">Solicitudes</a>
                <a class="btn btn-outline-light btn-sm fw-bold" href="./prestamos.html" data-roles="administrador direccion tecnico">Préstamos</a>
                <a class="btn btn-outline-light btn-sm fw-bold" href="./reportes.html" data-roles="administrador direccion tecnico">Reportes</a>
                <a class="btn btn-outline-light btn-sm fw-bold" href="./actividad.html" data-roles="administrador">Actividad</a>
                <!-- Cerrar sesión lo conecta sesion.js (mediante index.php?ruta=logout) -->
                <button type="button" id="btnCerrarSesion" class="btn btn-outline-danger btn-sm fw-bold">Cerrar sesión</button>
            </div>
        </div>
    </nav>

    <main class="container my-4 flex-grow-1">

        <header class="row mb-4">
            <div class="col-12 text-center">
                <h1 class="display-6 fw-bold text-dark bg-secondary text-white py-3 rounded shadow-sm">Inventario tecnológico</h1>
            </div>
        </header>

        <!-- Los resultados y errores los completa inventario.js con lo que responde la API -->
        <div id="mensajeAlerta" class="alert d-none" role="alert"></div>

        <!-- Altas: solo las ve el administrador (sesion.js oculta lo que no corresponde al rol, el servidor igual lo verifica) -->
        <section class="row mb-4" data-roles="administrador">
            <div class="col-12 d-flex justify-content-end gap-2">
                <button type="button" id="btnAltaSala" class="btn btn-dark fw-semibold shadow-sm px-4">Agregar sala</button>
                <button type="button" id="btnAltaEquipo" class="btn btn-dark fw-semibold shadow-sm px-4">Agregar equipo</button>
            </div>
        </section>

        <!-- Una tarjeta por sala con la tabla de sus equipos, las genera inventario.js a partir de GET index.php?ruta=inventario -->
        <section class="row mb-4" id="contenedorSalas">
        </section>
    </main>

    <!-- Historial de un equipo, lo completa inventario.js a partir de GET index.php?ruta=inventario&idEquipo= -->
    <div class="modal fade" id="modalHistorialEquipo" tabindex="-1" aria-labelledby="modalHistorialEquipoLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title h5 fw-bold" id="modalHistorialEquipoLabel">Historial del equipo</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">

                    <dl class="row mb-4" id="detalleEquipo">
                    </dl>

                    <h3 class="h6 fw-bold text-secondary">Eventos registrados</h3>
                    <div class="table-responsive">
                        <table class="table table-sm table-striped align-middle m-0">
                            <thead class="table-dark text-center">
                                <tr>
                                    <th scope="col">Fecha</th>
                                    <th scope="col">Acción</th>
                                    <th scope="col">Detalle</th>
                                    <th scope="col">Usuario</th>
                                </tr>
                            </thead>
                            <tbody id="cuerpoTablaHistorial" class="text-center">
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-dark fw-bold" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Alta y modificación de una sala, lo conecta inventario.js a POST / PUT index.php?ruta=inventario&recurso=salas -->
    <div class="modal fade" id="modalGestionarSala" tabindex="-1" aria-labelledby="modalGestionarSalaLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="formularioGestionarSala" novalidate>
                    <div class="modal-header">
                        <h2 class="modal-title h5 fw-bold" id="modalGestionarSalaLabel">Agregar sala</h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <div id="mensajeFormularioSala" class="alert d-none" role="alert"></div>

                        <div class="mb-3">
                            <label for="tipoSala" class="form-label fw-semibold text-secondary">Tipo:</label>
                            <select id="tipoSala" class="form-select" required>
                                <option value="" disabled selected>Seleccione un tipo</option>
                                <option value="Laboratorio">Laboratorio</option>
                                <option value="Taller">Taller</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="numeroSala" class="form-label fw-semibold text-secondary">Número:</label>
                            <input type="number" id="numeroSala" class="form-control" min="1" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" id="btnConfirmarSala" class="btn btn-dark w-100 fw-bold">Confirmar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Alta y modificación de un equipo, lo conecta inventario.js a POST / PUT index.php?ruta=inventario&recurso=equipos -->
    <div class="modal fade" id="modalGestionarEquipo" tabindex="-1" aria-labelledby="modalGestionarEquipoLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="formularioGestionarEquipo" novalidate>
                    <div class="modal-header">
                        <h2 class="modal-title h5 fw-bold" id="modalGestionarEquipoLabel">Agregar equipo</h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <div id="mensajeFormularioEquipo" class="alert d-none" role="alert"></div>

                        <div class="mb-3">
                            <label for="salaEquipo" class="form-label fw-semibold text-secondary">Sala:</label>
                            <select id="salaEquipo" class="form-select" required>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="numeroEquipo" class="form-label fw-semibold text-secondary">Número de equipo:</label>
                            <input type="number" id="numeroEquipo" class="form-control" min="1" required>
                        </div>

                        <div class="mb-3">
                            <label for="estadoEquipo" class="form-label fw-semibold text-secondary">Estado:</label>
                            <select id="estadoEquipo" class="form-select" required>
                                <option value="Funcionando">Funcionando</option>
                                <option value="Incidencia">Incidencia</option>
                                <option value="Fuera de servicio">Fuera de servicio</option>
                            </select>
                        </div>

                        <div class="mb-3 d-none" id="cajaIncidencia">
                            <label for="incidenciaEquipo" class="form-label fw-semibold text-secondary">Descripción de la incidencia:</label>
                            <textarea id="incidenciaEquipo" class="form-control" maxlength="255" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" id="btnConfirmarEquipo" class="btn btn-dark w-100 fw-bold">Confirmar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer class="w-100 bg-secondary text-white text-center py-3">
        <p class="m-0 small">&copy; 2026 PeartoS.A</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/sesion.js"></script>
    <script src="../assets/js/inventario.js"></script>
</body>
</html>
