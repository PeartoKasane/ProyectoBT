<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dirección - SGRSI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../assets/css/global.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100 justify-content-between" data-panel="direccion">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="#">SGRSI - Panel Dirección</a>
            <div class="navbar-nav ms-auto d-flex flex-row gap-2">
                <a class="btn btn-outline-light btn-sm fw-bold" href="./administrador.html" data-roles="administrador">Inicio</a>
                <a class="btn btn-light btn-sm fw-bold" href="./direccion.html" data-roles="direccion">Inicio</a>
                <a class="btn btn-outline-light btn-sm fw-bold" href="./docente.html" data-roles="docente">Inicio</a>
                <a class="btn btn-outline-light btn-sm fw-bold" href="./tecnico.html" data-roles="tecnico">Inicio</a>
                <a class="btn btn-outline-light btn-sm fw-bold" href="./inventario.html">Inventario</a>
                <a class="btn btn-outline-light btn-sm fw-bold" href="./tickets.html">Tickets</a>
                <a class="btn btn-outline-light btn-sm fw-bold" href="./solicitudes.html">Solicitudes</a>
                <a class="btn btn-outline-light btn-sm fw-bold" href="./prestamos.html" data-roles="administrador direccion tecnico">Préstamos</a>
                <a class="btn btn-outline-light btn-sm fw-bold" href="./reportes.html" data-roles="administrador direccion tecnico">Reportes</a>
                <a class="btn btn-outline-light btn-sm fw-bold" href="./actividad.html" data-roles="administrador">Actividad</a>
                <button type="button" id="btnCerrarSesion" class="btn btn-outline-danger btn-sm fw-bold">Cerrar sesión</button>
            </div>
        </div>
    </nav>

    <main class="container my-4 flex-grow-1">

        <header class="row mb-4">
            <div class="col-12 text-center">
                <h1 class="display-6 fw-bold text-dark bg-secondary text-white py-3 rounded shadow-sm">Resumen general de personal</h1>
            </div>
        </header>

        <!-- Los resultados y errores los completa el script de la página con lo que responde la API -->
        <div id="mensajeAlerta" class="alert d-none" role="alert"></div>

        <!-- Las filas las genera panel.js a partir de GET ?ruta=reportes&recurso=personal -->
        <section class="row mb-4">
            <div class="col-12">
                <div class="table-responsive shadow-sm rounded bg-white p-3">
                    <table class="table table-striped table-hover align-middle m-0">
                        <caption class="px-2">Resumen institucional por rol</caption>
                        <thead class="table-dark text-center">
                            <tr>
                                <th scope="col">Cédula</th>
                                <th scope="col">Nombre</th>
                                <th scope="col">Apellido</th>
                                <th scope="col">Rol</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpoTablaDireccion" class="text-center">
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <footer class="w-100 bg-secondary text-white text-center py-3">
        <p class="m-0 small">&copy; 2026 PeartoS.A</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/sesion.js"></script>
    <script src="../assets/js/panel.js"></script>
</body>
</html>
