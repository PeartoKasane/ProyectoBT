<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGRSI - PeartoS.A</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../assets/css/global.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100 justify-content-between">

    <header class="w-100 bg-secondary text-white text-center py-4 shadow-sm">
        <h1 class="display-5 fw-bold m-0">Bienvenido/a a SGRSI</h1>
    </header>

    <main class="container d-flex flex-column align-items-center justify-content-center my-auto p-3">
        <section class="card shadow border-0 p-4 w-100 login-card" style="max-width: 420px;" aria-labelledby="login-title">
            <div class="card-body">
                <h2 id="login-title" class="card-title text-center mb-3 h3 fw-bold text-dark">Iniciar Sesión</h2>
                <p class="text-muted text-center small mb-4">Por favor, ingresa tus credenciales para acceder al sistema.</p>

                <!-- Los mensajes de error los completa login.js con lo que responde la API -->
                <div id="mensajeAlerta" class="alert alert-danger d-none" role="alert"></div>

                <form action="#" method="post" id="formularioLogin">
                    <div class="mb-3">
                        <label for="cedula" class="form-label fw-semibold text-secondary">Cédula:</label>
                        <input type="text" id="cedula" name="cedula" class="form-control form-control-lg text-center"
                            placeholder="Ej: 12345678" autocomplete="username" pattern="[1-9][0-9]{7}"
                            title="Ingrese exactamente 8 dígitos sin puntos ni guiones" inputmode="numeric"
                            maxlength="8" required>
                    </div>

                    <div class="mb-4">
                        <label for="clave" class="form-label fw-semibold text-secondary">Contraseña:</label>
                        <input type="password" id="clave" name="clave" class="form-control form-control-lg text-center"
                            placeholder="••••••••" autocomplete="current-password" minlength="12" required>
                    </div>

                    <button type="submit" class="btn btn-dark btn-lg w-100 fw-bold shadow-sm py-2">
                        Ingresar
                    </button>
                </form>
            </div>
        </section>
    </main>

    <footer class="w-100 bg-secondary text-white text-center py-3">
        <p class="m-0 small">&copy; 2026 PeartoS.A</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/login.js"></script>
</body>
</html>
