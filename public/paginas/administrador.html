<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador - SGRSI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../assets/css/global.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100 justify-content-between">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="#">SGRSI - Panel Administrador</a>
            <div class="navbar-nav ms-auto d-flex flex-row gap-2">
                <a class="btn btn-light btn-sm fw-bold" href="./administrador.html" data-roles="administrador">Inicio</a>
                <a class="btn btn-outline-light btn-sm fw-bold" href="./direccion.html" data-roles="direccion">Inicio</a>
                <a class="btn btn-outline-light btn-sm fw-bold" href="./docente.html" data-roles="docente">Inicio</a>
                <a class="btn btn-outline-light btn-sm fw-bold" href="./tecnico.html" data-roles="tecnico">Inicio</a>
                <a class="btn btn-outline-light btn-sm fw-bold" href="./inventario.html">Inventario</a>
                <a class="btn btn-outline-light btn-sm fw-bold" href="./tickets.html">Tickets</a>
                <a class="btn btn-outline-light btn-sm fw-bold" href="./solicitudes.html">Solicitudes</a>
                <a class="btn btn-outline-light btn-sm fw-bold" href="./prestamos.html" data-roles="administrador direccion tecnico">Préstamos</a>
                <a class="btn btn-outline-light btn-sm fw-bold" href="./reportes.html" data-roles="administrador direccion tecnico">Reportes</a>
                <a class="btn btn-outline-light btn-sm fw-bold" href="./actividad.html" data-roles="administrador">Actividad</a>
                <!-- Cerrar sesión lo conecta sesion.js (mediante index.php?ruta=logout) -->
                <button type="button" id="btnCerrarSesion" class="btn btn-outline-danger btn-sm fw-bold">Cerrar sesión</button>
            </div>
        </div>
    </nav>

    <main class="container my-4 flex-grow-1">

        <header class="row mb-4">
            <div class="col-12 text-center">
                <h1 class="display-6 fw-bold text-dark bg-secondary text-white py-3 rounded shadow-sm">Datos de empleados</h1>
            </div>
        </header>

        <!-- Los resultados y errores los completa usuarios.js con lo que responde la API -->
        <div id="mensajeAlerta" class="alert d-none" role="alert"></div>

        <section class="row mb-4">
            <div class="col-12 text-end mb-3">
                <button type="button" class="btn btn-dark fw-semibold shadow-sm px-4" id="btnAltaUsuario">
                    Alta de empleado
                </button>
            </div>

            <div class="col-12">
                <div class="table-responsive shadow-sm rounded bg-white p-3">
                    <table class="table table-striped table-hover align-middle m-0">
                        <caption class="px-2">Listado de empleados registrados</caption>
                        <thead class="table-dark text-center">
                            <tr>
                                <th scope="col">Cédula</th>
                                <th scope="col">Nombre</th>
                                <th scope="col">Apellido</th>
                                <th scope="col">Rol</th>
                                <th scope="col">Estado</th>
                                <th scope="col">Acciones</th>
                            </tr>
                        </thead>
                        <!-- Las filas las genera usuarios.js a partir de GET index.php?ruta=usuarios -->
                        <tbody id="cuerpoTablaUsuarios" class="text-center">
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <div class="modal fade" id="modalGestionarUsuario" tabindex="-1" aria-labelledby="modalGestionarUsuarioLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form action="#" method="post" id="formularioGestionarUsuario">
                    <div class="modal-header">
                        <h2 class="modal-title h5 fw-bold" id="modalGestionarUsuarioLabel">Gestión de empleado</h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <!-- Errores del formulario, se muestran acá para que se vean con el modal abierto -->
                        <div id="mensajeFormulario" class="alert d-none" role="alert"></div>

                        <div class="mb-3">
                            <label for="cedula" class="form-label fw-semibold text-secondary">Cédula:</label>
                            <input type="text" id="cedula" name="cedula" class="form-control" placeholder="Ej: 12345678"
                                autocomplete="off" pattern="[1-9][0-9]{7}"
                                title="Ingrese exactamente 8 dígitos sin puntos ni guiones" inputmode="numeric"
                                maxlength="8" required>
                        </div>

                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-semibold text-secondary">Nombre:</label>
                            <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Ingrese el nombre"
                                autocomplete="given-name" required>
                        </div>

                        <div class="mb-3">
                            <label for="apellido" class="form-label fw-semibold text-secondary">Apellido:</label>
                            <input type="text" id="apellido" name="apellido" class="form-control" placeholder="Ingrese el apellido"
                                autocomplete="family-name" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold text-secondary">Correo electrónico:</label>
                            <input type="email" id="email" name="email" class="form-control" placeholder="Ingrese el correo"
                                autocomplete="email">
                        </div>

                        <div class="mb-3">
                            <label for="clave" class="form-label fw-semibold text-secondary">Contraseña:</label>
                            <input type="password" id="clave" name="clave" class="form-control" autocomplete="new-password"
                                minlength="12" required>
                        </div>

                        <div class="mb-3">
                            <label for="confirmarClave" class="form-label fw-semibold text-secondary">Confirmar contraseña:</label>
                            <input type="password" id="confirmarClave" name="confirmarClave" class="form-control"
                                autocomplete="new-password" minlength="12" required>
                        </div>

                        <div class="mb-3">
                            <label for="rol" class="form-label fw-semibold text-secondary">Rol:</label>
                            <select name="rol" id="rol" class="form-select" required>
                                <option value="" disabled selected>Seleccione un rol</option>
                                <option value="Administrador">Administrador</option>
                                <option value="Docente">Docente</option>
                                <option value="Dirección">Dirección</option>
                                <option value="Técnico">Técnico</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-dark w-100 fw-bold" id="btnConfirmarUsuario">Confirmar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer class="w-100 bg-secondary text-white text-center py-3">
        <p class="m-0 small">&copy; 2026 PeartoS.A</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/sesion.js"></script>
    <script src="../assets/js/usuarios.js"></script>
</body>
</html>
