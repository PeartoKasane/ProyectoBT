<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de actividad - SGRSI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../assets/css/global.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100 justify-content-between">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="#">SGRSI - Actividad</a>
            <div class="navbar-nav ms-auto d-flex flex-row gap-2">
                <a class="btn btn-outline-light btn-sm fw-bold" href="./administrador.html" data-roles="administrador">Inicio</a>
                <a class="btn btn-outline-light btn-sm fw-bold" href="./direccion.html" data-roles="direccion">Inicio</a>
                <a class="btn btn-outline-light btn-sm fw-bold" href="./docente.html" data-roles="docente">Inicio</a>
                <a class="btn btn-outline-light btn-sm fw-bold" href="./tecnico.html" data-roles="tecnico">Inicio</a>
                <a class="btn btn-outline-light btn-sm fw-bold" href="./inventario.html">Inventario</a>
                <a class="btn btn-outline-light btn-sm fw-bold" href="./tickets.html">Tickets</a>
                <a class="btn btn-outline-light btn-sm fw-bold" href="./solicitudes.html">Solicitudes</a>
                <a class="btn btn-outline-light btn-sm fw-bold" href="./prestamos.html" data-roles="administrador direccion tecnico">Préstamos</a>
                <a class="btn btn-outline-light btn-sm fw-bold" href="./reportes.html" data-roles="administrador direccion tecnico">Reportes</a>
                <a class="btn btn-light btn-sm fw-bold" href="./actividad.html" data-roles="administrador">Actividad</a>
                <button type="button" id="btnCerrarSesion" class="btn btn-outline-danger btn-sm fw-bold">Cerrar sesión</button>
            </div>
        </div>
    </nav>

    <main class="container my-4 flex-grow-1">

        <header class="row mb-4">
            <div class="col-12 text-center">
                <h1 class="display-6 fw-bold text-dark bg-secondary text-white py-3 rounded shadow-sm">Registro de actividad</h1>
            </div>
        </header>

        <!-- Los resultados y errores los completa actividad.js con lo que responde la API -->
        <div id="mensajeAlerta" class="alert d-none" role="alert"></div>

        <!-- RNF4: filtros de la consulta (solo administrador) -->
        <form id="formularioFiltro" class="row g-2 align-items-end mb-4 bg-white shadow-sm rounded p-3">
            <div class="col-12 col-md-3">
                <label for="filtroDesde" class="form-label fw-semibold text-secondary">Desde:</label>
                <input type="date" id="filtroDesde" class="form-control">
            </div>
            <div class="col-12 col-md-3">
                <label for="filtroHasta" class="form-label fw-semibold text-secondary">Hasta:</label>
                <input type="date" id="filtroHasta" class="form-control">
            </div>
            <div class="col-12 col-md-3">
                <label for="filtroCedula" class="form-label fw-semibold text-secondary">Cédula (opcional):</label>
                <input type="text" id="filtroCedula" class="form-control" inputmode="numeric" maxlength="8" pattern="[1-9][0-9]{7}"
                    title="Ingrese exactamente 8 dígitos sin puntos ni guiones" placeholder="Ej: 12345678">
            </div>
            <div class="col-12 col-md-3">
                <button type="submit" class="btn btn-dark fw-bold w-100">Consultar</button>
            </div>
        </form>

        <section class="table-responsive shadow-sm rounded bg-white p-3">
            <table class="table table-striped table-hover align-middle m-0">
                <caption class="px-2">Operaciones que modificaron datos, de la más reciente a la más antigua</caption>
                <thead class="table-dark text-center">
                    <tr>
                        <th scope="col">Fecha</th>
                        <th scope="col">Usuario</th>
                        <th scope="col">Acción</th>
                        <th scope="col">Sección</th>
                        <th scope="col">Detalle</th>
                    </tr>
                </thead>
                <tbody id="cuerpoTablaActividad" class="text-center">
                </tbody>
            </table>
        </section>
    </main>

    <footer class="w-100 bg-secondary text-white text-center py-3">
        <p class="m-0 small">&copy; 2026 PeartoS.A</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/sesion.js"></script>
    <script src="../assets/js/actividad.js"></script>
</body>
</html>
